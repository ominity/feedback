name: "🐛 Bug report"
description: "Report something that is not working as expected"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Ominity.

        Before submitting, please check whether a similar issue already exists.

        > **Important:** Do not include passwords, API keys, access tokens, customer data, personal data, invoices, or other sensitive information in this public issue.

  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: "Describe the problem as clearly as possible."
      placeholder: "Tell us what went wrong..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "What can we do to reproduce the problem?"
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Enter ...
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen instead?"
      placeholder: "I expected..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which part of Ominity is affected?"
      options:
        - Content
        - Commerce
        - Bookings
        - Customers
        - Orders
        - Payments
        - Invoicing
        - Administration / Settings
        - API
        - Storefront / Website
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "How often does this happen?"
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: "Browser / device"
      description: "If relevant, tell us which browser and device you are using."
      placeholder: "e.g. Chrome 152 on macOS, Safari on iPhone"

  - type: textarea
    id: additional
    attributes:
      label: "Additional information"
      description: "Add screenshots, screen recordings, error messages, or any other useful context. You can drag and drop files here."

  - type: checkboxes
    id: sensitive
    attributes:
      label: "Sensitive information"
      options:
        - label: "I have checked that this report does not contain passwords, API keys, access tokens, personal data, or other sensitive information."
          required: true
